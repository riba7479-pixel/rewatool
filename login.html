<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Rewatool.online</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue: #000814;
            --electric-blue: #00d2ff;
            --border: rgba(0, 210, 255, 0.3);
            --card-bg: rgba(0, 20, 50, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--deep-blue);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #001d4d 0%, #000814 100%);
        }

        /* Neural Background Animation */
        #bg-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

        /* --- LOGIN CARD --- */
        .auth-card {
            width: 92%;
            max-width: 400px;
            padding: 40px 30px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo { font-weight: 800; font-size: 1.7rem; text-align: center; margin-bottom: 8px; }
        .logo span { color: var(--electric-blue); }

        h2 { text-align: center; font-size: 1.1rem; margin-bottom: 30px; color: rgba(255,255,255,0.7); font-weight: 500; }

        /* --- FORM STYLING --- */
        .form-group { margin-bottom: 20px; }
        
        label { display: block; font-size: 13px; color: var(--electric-blue); margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }

        input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #fff;
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--electric-blue), #0077ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
        }

        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0, 210, 255, 0.5); }
        .btn-login:active { transform: scale(0.98); }

        .forgot-pass { display: block; text-align: right; font-size: 12px; color: var(--electric-blue); margin-top: 8px; text-decoration: none; opacity: 0.8; }
        .forgot-pass:hover { opacity: 1; }

        .switch { text-align: center; margin-top: 30px; font-size: 14px; color: rgba(255,255,255,0.5); }
        .switch a { color: var(--electric-blue); text-decoration: none; font-weight: 700; border-bottom: 1px solid transparent; transition: 0.3s; }
        .switch a:hover { border-bottom: 1px solid var(--electric-blue); }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="auth-card">
        <div class="logo">REWATOOL<span>.online</span></div>
        <h2>Welcome Back</h2>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>

        <p class="switch">New here? <a href="signup.html">Create Account</a></p>
    </div>

    <script>
        // Smooth Neural Animation (GPU Optimized)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            let count = window.innerWidth < 768 ? 35 : 60;
            for (let i = 0; i < count; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach((d, i) => {
                d.x += d.vx; d.y += d.vy;
                if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
                if (d.y < 0 || d.y > canvas.height) d.vy *= -1;

                ctx.fillStyle = 'rgba(0, 210, 255, 0.4)';
                ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, Math.PI * 2); ctx.fill();

                for (let j = i + 1; j < dots.length; j++) {
                    let dist = Math.sqrt((d.x - dots[j].x)**2 + (d.y - dots[j].y)**2);
                    if (dist < 140) {
                        ctx.strokeStyle = `rgba(0, 210, 255, ${0.15 - dist/1000})`;
                        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init(); animate();
    </script>
</body>
</html>
