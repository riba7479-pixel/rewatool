<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai REWATOOL - Powerful & Professional Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #0c1a2d 0%, #152642 50%, #0e1b33 100%);
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-blue: #0066ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow-intensity: 0.8;
        }

        body {
            background: var(--primary-gradient);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            width: 200%;
            height: 200%;
            opacity: 0.15;
            background: radial-gradient(circle at center, var(--neon-cyan) 0%, transparent 70%);
            animation: waveMove 25s infinite linear;
        }

        .wave-1 {
            top: -50%;
            left: -50%;
            animation-duration: 30s;
            opacity: 0.1;
            background: radial-gradient(circle at center, var(--neon-magenta) 0%, transparent 70%);
        }

        .wave-2 {
            top: -30%;
            left: -30%;
            animation-duration: 20s;
            animation-direction: reverse;
            opacity: 0.12;
        }

        .wave-3 {
            top: -70%;
            left: -10%;
            animation-duration: 35s;
            opacity: 0.08;
            background: radial-gradient(circle at center, var(--neon-blue) 0%, transparent 70%);
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes waveMove {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-20px) translateX(10px); }
            50% { transform: translateY(0) translateX(20px); }
            75% { transform: translateY(20px) translateX(10px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 10;
        }

        .logo-icon {
            color: var(--neon-cyan);
            font-size: 2rem;
            filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.7));
        }

        .main-content {
            text-align: center;
            width: 100%;
            max-width: 900px;
            margin-top: 2rem;
        }

        .branding-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 4rem;
            margin-bottom: 4rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1.2s ease-out;
        }

        .branding-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(0, 243, 255, 0.05) 0%, 
                rgba(255, 0, 255, 0.05) 50%, 
                rgba(0, 102, 255, 0.05) 100%);
            z-index: -1;
        }

        .branding-text {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ffffff, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            letter-spacing: -0.5px;
        }

        .branding-subtitle {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 1rem;
            text-transform: uppercase;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            animation: fadeInUp 1.2s ease-out 0.3s both;
        }

        .btn {
            padding: 1.2rem 2.8rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            min-width: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--neon-cyan), #0088cc);
            color: #0c1a2d;
            box-shadow: 0 0 25px rgba(0, 243, 255, var(--glow-intensity)),
                        0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 0 35px rgba(0, 243, 255, calc(var(--glow-intensity) + 0.2)),
                        0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-signup {
            background: linear-gradient(135deg, var(--neon-magenta), #9900cc);
            color: white;
            box-shadow: 0 0 25px rgba(255, 0, 255, var(--glow-intensity)),
                        0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-signup:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 0 35px rgba(255, 0, 255, calc(var(--glow-intensity) + 0.2)),
                        0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-login {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1),
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .btn-login:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5),
                        inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .btn-icon {
            font-size: 1.3rem;
        }

        .features-preview {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 5rem;
            flex-wrap: wrap;
            animation: fadeInUp 1.2s ease-out 0.6s both;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            width: 180px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--neon-cyan);
            box-shadow: 0 10px 25px rgba(0, 243, 255, 0.2);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--neon-cyan);
        }

        .feature-title {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            z-index: 10;
        }

        .glow-line {
            position: absolute;
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-magenta), transparent);
            bottom: 0;
            left: 0;
            filter: blur(1px);
            opacity: 0.7;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .branding-text {
                font-size: 3rem;
            }
            
            .branding-subtitle {
                font-size: 1.2rem;
            }
            
            .btn {
                padding: 1rem 2rem;
                min-width: 160px;
            }
        }

        @media (max-width: 768px) {
            .branding-text {
                font-size: 2.5rem;
            }
            
            .branding-container {
                padding: 2rem;
            }
            
            .buttons-container {
                gap: 1.5rem;
            }
            
            .btn {
                min-width: 140px;
                padding: 0.9rem 1.5rem;
                font-size: 1.1rem;
            }
            
            .features-preview {
                gap: 1rem;
            }
            
            .feature-card {
                width: 150px;
                padding: 1rem;
            }
        }

        @media (max-width: 576px) {
            .branding-text {
                font-size: 2rem;
            }
            
            .branding-subtitle {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            
            .buttons-container {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 280px;
            }
            
            .features-preview {
                margin-top: 3rem;
            }
            
            .feature-card {
                width: 130px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="background-container">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <i class="fas fa-robot logo-icon"></i>
            <span>Ai REWATOOL</span>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Branding with Glass Effect -->
            <div class="branding-container">
                <h1 class="branding-text">Ai REWATOOL</h1>
                <p class="branding-subtitle">Powerful & Professional Tools</p>
                <div class="glow-line"></div>
            </div>

            <!-- Action Buttons -->
            <div class="buttons-container">
                <a href="dashboard2.html" class="btn btn-start">
                    <i class="fas fa-play-circle btn-icon"></i>
                    Start Free
                </a>
                <a href="register.html" class="btn btn-signup">
                    <i class="fas fa-user-plus btn-icon"></i>
                    Sign Up
                </a>
                <a href="login.html" class="btn btn-login">
                    <i class="fas fa-sign-in-alt btn-icon"></i>
                    Login
                </a>
            </div>

            <!-- Features Preview -->
            <div class="features-preview">
                <div class="feature-card">
                    <i class="fas fa-brain feature-icon"></i>
                    <p class="feature-title">AI-Powered Analysis</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-chart-line feature-icon"></i>
                    <p class="feature-title">Advanced Analytics</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-bolt feature-icon"></i>
                    <p class="feature-title">Real-Time Processing</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-shield-alt feature-icon"></i>
                    <p class="feature-title">Enterprise Security</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2023 Ai REWATOOL. All rights reserved. Experience the future of AI tools today.</p>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.querySelector('.background-container');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size and position
                const size = Math.random() * 4 + 1;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 10;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                
                container.appendChild(particle);
            }
        }

        // Interactive button effects
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            const buttons = document.querySelectorAll('.btn');
            
            buttons.forEach(button => {
                // Add ripple effect on click
                button.addEventListener('click', function(e) {
                    // Create ripple element
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = `${size}px`;
                    ripple.style.left = `${x}px`;
                    ripple.style.top = `${y}px`;
                    ripple.classList.add('ripple');
                    
                    // Add ripple styles
                    ripple.style.position = 'absolute';
                    ripple.style.borderRadius = '50%';
                    ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.7)';
                    ripple.style.transform = 'scale(0)';
                    ripple.style.animation = 'ripple-animation 0.6s linear';
                    
                    this.appendChild(ripple);
                    
                    // Remove ripple after animation completes
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                    
                    // For demo purposes, show alert if page doesn't exist
                    const href = this.getAttribute('href');
                    if (href === 'dashboard2.html' || href === 'register.html' || href === 'login.html') {
                        // In a real implementation, these would navigate to actual pages
                        // For this demo, we'll just show an alert
                        e.preventDefault();
                        const pageName = href.split('.')[0];
                        alert(`In a real implementation, this would navigate to: ${pageName}`);
                    }
                });
                
                // Enhanced hover effect
                button.addEventListener('mouseenter', function() {
                    this.style.transform = this.classList.contains('btn-login') 
                        ? 'translateY(-8px) scale(1.05)' 
                        : 'translateY(-8px) scale(1.05)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
            
            // Parallax effect for waves
            document.addEventListener('mousemove', function(e) {
                const waves = document.querySelectorAll('.wave');
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                waves.forEach((wave, index) => {
                    const speed = 0.5 + index * 0.2;
                    const x = (mouseX * speed * 100) - 50;
                    const y = (mouseY * speed * 100) - 50;
                    
                    wave.style.transform = `translate(${x}px, ${y}px) rotate(${index * 45}deg)`;
                });
            });
            
            // Add CSS for ripple animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes ripple-animation {
                    to {
                        transform: scale(4);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
