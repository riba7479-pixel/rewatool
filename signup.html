<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up | Rewatool.online</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue: #000814;
            --electric-blue: #00d2ff;
            --card-bg: rgba(10, 25, 50, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--deep-blue);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #001d4d 0%, #000814 100%);
            overflow: hidden;
        }

        /* Neural Taar Animation Canvas */
        #bg-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

        /* --- AUTH CARD --- */
        .auth-card {
            width: 90%; max-width: 400px;
            padding: 40px 25px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 30px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: cardPop 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        @keyframes cardPop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo { font-weight: 800; font-size: 1.6rem; margin-bottom: 20px; color: white; letter-spacing: -1px; }
        .logo span { color: var(--electric-blue); }

        h2 { font-size: 1.5rem; color: #fff; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 35px; }

        /* --- BUTTONS STYLE --- */
        .social-btn {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            display: flex; align-items: center; justify-content: flex-start;
            cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: var(--electric-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2);
        }

        .social-btn img { width: 22px; margin-right: 15px; }
        
        /* White Icons for Apple/Email */
        .white-icon { filter: invert(1); }

        .divider { 
            margin: 25px 0; 
            color: rgba(255,255,255,0.2); 
            font-size: 12px; 
            display: flex; 
            align-items: center; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 15px; }

        .footer-links { margin-top: 30px; }
        .help-link { color: #ff66cc; text-decoration: none; font-size: 14px; font-weight: 700; transition: 0.3s; }
        .help-link:hover { text-shadow: 0 0 10px #ff66cc; }

        .login-text { margin-top: 15px; font-size: 13px; color: rgba(255,255,255,0.4); }
        .login-text a { color: var(--electric-blue); text-decoration: none; font-weight: 600; }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="auth-card">
        <div class="logo">REWATOOL<span>.online</span></div>
        <h2>Create Account</h2>
        <p class="subtitle">Join the professional AI workspace.</p>

        <button class="social-btn" onclick="alert('Google Authentication System Connecting...')">
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">
            Continue with Google
        </button>

        <button class="social-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/0/747.png" alt="Apple" class="white-icon">
            Continue with Apple
        </button>

        <button class="social-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732221.png" alt="Microsoft">
            Continue with Microsoft
        </button>

        <div class="divider">Or</div>

        <button class="social-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/542/542638.png" alt="Email" class="white-icon">
            Continue with Email
        </button>

        <div class="footer-links">
            <a href="#" class="help-link">Need help?</a>
            <p class="login-text">Already a member? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script>
        // Smooth Neural Network Animation
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            let count = window.innerWidth < 768 ? 35 : 65;
            for (let i = 0; i < count; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach((d, i) => {
                d.x += d.vx; d.y += d.vy;
                if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
                if (d.y < 0 || d.y > canvas.height) d.vy *= -1;

                ctx.fillStyle = 'rgba(0, 210, 255, 0.3)';
                ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, Math.PI * 2); ctx.fill();

                for (let j = i + 1; j < dots.length; j++) {
                    let dist = Math.sqrt((d.x - dots[j].x)**2 + (d.y - dots[j].y)**2);
                    if (dist < 150) {
                        ctx.strokeStyle = `rgba(0, 210, 255, ${0.12 - dist/1200})`;
                        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
