<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up | Rewatool.online</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue: #000814;
            --electric-blue: #00d2ff;
            --border: rgba(0, 210, 255, 0.3);
            --card-bg: rgba(0, 20, 50, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--deep-blue);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #001d4d 0%, #000814 100%);
        }

        /* Smooth Background Animation */
        #bg-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

        /* --- SIGNUP CARD --- */
        .auth-card {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo { font-weight: 800; font-size: 1.6rem; text-align: center; margin-bottom: 5px; }
        .logo span { color: var(--electric-blue); }

        h2 { text-align: center; font-size: 1.2rem; margin-bottom: 25px; color: rgba(255,255,255,0.8); }

        /* --- FORM STYLING --- */
        .form-group { margin-bottom: 18px; }
        
        label { display: block; font-size: 13px; color: var(--electric-blue); margin-bottom: 6px; font-weight: 600; }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #fff;
            background: rgba(0, 210, 255, 0.1);
        }

        .btn-join {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--electric-blue), #0077ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-join:hover { transform: scale(1.02); filter: brightness(1.1); }
        .btn-join:active { transform: scale(0.98); }

        .switch { text-align: center; margin-top: 20px; font-size: 14px; color: rgba(255,255,255,0.5); }
        .switch a { color: var(--electric-blue); text-decoration: none; font-weight: 700; }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="auth-card">
        <div class="logo">REWATOOL<span>.online</span></div>
        <h2>Create your account</h2>

        <form id="signupForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a strong password" required>
            </div>
            <button type="submit" class="btn-join">Sign Up Now</button>
        </form>

        <p class="switch">Already a member? <a href="login.html">Login</a></p>
    </div>

    <script>
        // Smooth Neural Animation (Optimized for Speed)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            for (let i = 0; i < 50; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach((d, i) => {
                d.x += d.vx; d.y += d.vy;
                if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
                if (d.y < 0 || d.y > canvas.height) d.vy *= -1;

                ctx.fillStyle = 'rgba(0, 210, 255, 0.4)';
                ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, Math.PI * 2); ctx.fill();

                for (let j = i + 1; j < dots.length; j++) {
                    let dist = Math.sqrt((d.x - dots[j].x)**2 + (d.y - dots[j].y)**2);
                    if (dist < 150) {
                        ctx.strokeStyle = `rgba(0, 210, 255, ${0.15 - dist/1000})`;
                        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
